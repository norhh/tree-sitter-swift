[package]
name = "tree-sitter-swift"
description = "Query-optimized Swift grammar for the tree-sitter parsing library"
version = "0.3.6"
keywords = ["incremental", "parsing", "swift"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/norhh/tree-sitter-swift"
edition = "2018"
license = "MIT"

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter = "^0.20.4"

[build-dependencies]
cc = "1.0"

[dev-dependencies]
anyhow = "1.0"
regex = "1.11.1"
